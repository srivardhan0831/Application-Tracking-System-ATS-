<!DOCTYPE html>
<html>
<head>
    <title>ATS Resume Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            color: white;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        input, textarea {
            background: rgba(255,255,255,0.2) !important;
            border: none !important;
            color: white !important;
        }

        input::placeholder, textarea::placeholder {
            color: #ddd;
        }

        .btn-premium {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            transition: 0.3s ease;
        }

        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.6);
        }

        .progress {
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            transition: width 2s cubic-bezier(.4,0,.2,1);
        }

        .spinner {
            display: none;
            text-align: center;
        }

    </style>
</head>
<body>

<div class="glass-card">
    <h2 class="text-center mb-4">🚀 ATS Resume Analyzer</h2>

    <form method="POST" action="{% url 'upload' %}" enctype="multipart/form-data" onsubmit="showLoader()">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="name" class="form-control" placeholder="Your Name" required>
        </div>

        <div class="mb-3">
            <input type="file" name="file" class="form-control" required>
        </div>

        <div class="mb-3">
            <textarea name="job_description" rows="4" class="form-control"
                placeholder="Paste Job Description Here..." required></textarea>
        </div>

        <button type="submit" class="btn btn-premium w-100">
            Analyze Resume
        </button>
    </form>

    <div class="spinner mt-3" id="loader">
        <div class="spinner-border text-light" role="status"></div>
        <p>Analyzing Resume...</p>
    </div>

    {% if score %}
    <div class="mt-4">
        <h5 class="text-center">Match Score: {{ score }}%</h5>
        <div class="progress">
            <div id="scoreBar" class="progress-bar 
                {% if score < 40 %}bg-danger
                {% elif score < 70 %}bg-warning
                {% else %}bg-success
                {% endif %}"
                style="width: 0%;">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let score = {{ score|default:0 }};
        let bar = document.getElementById("scoreBar");

        if (bar) {
            setTimeout(() => {
                bar.style.width = score + "%";
            }, 300);
        }
    });
    </script>
    {% endif %}

</div>

<script>
function showLoader() {
    document.getElementById("loader").style.display = "block";
}
</script>

</body>
</html>
